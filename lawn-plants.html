<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Plants</title>
<meta name="theme-color" content="#3A2E22">
<style>
  :root{
    --bg:#F6F1E4; --card:#FFFFFF; --ink:#2A2420; --ink-soft:#6B5F52; --line:#DCCFAE;
    --moss:#3F5B3A; --moss-soft:#DEE7D3; --clay:#B5583A; --amber-soft:#F1E1BC; color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#221A13; --card:#2C2318; --ink:#EFE6D6; --ink-soft:#B9A98F; --line:#4A3B29;
      --moss:#7FA06F; --moss-soft:#2C3527; --clay:#D9805F; --amber-soft:#3C3018; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#221A13; --card:#2C2318; --ink:#EFE6D6; --ink-soft:#B9A98F; --line:#4A3B29;
    --moss:#7FA06F; --moss-soft:#2C3527; --clay:#D9805F; --amber-soft:#3C3018; color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;padding:20px 16px 130px;}
  main{max-width:600px;margin:0 auto;}
  h1{font-size:24px;margin:4px 0 6px;}
  h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin:26px 0 6px;}
  p{color:var(--ink-soft);font-size:15px;line-height:1.45;margin:6px 0 12px;}
  input[type=search],input[type=text],select{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);}
  label.plant{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
              border-radius:14px;padding:12px 14px;margin:8px 0;cursor:pointer;}
  label.plant:has(input:checked){border-color:var(--moss);background:var(--moss-soft);}
  label.plant.far{opacity:.6;}
  label.plant input{width:22px;height:22px;margin-top:2px;accent-color:var(--moss);flex-shrink:0;}
  .em{font-size:22px;line-height:1;}
  .name{font-weight:600;font-size:16px;}
  .tasks{color:var(--ink-soft);font-size:13.5px;margin-top:3px;line-height:1.4;}
  .zone{display:inline-block;font-size:12px;padding:1px 7px;border-radius:99px;background:var(--amber-soft);margin-left:4px;}
  .custom{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--moss);border-radius:14px;padding:12px 14px;margin:8px 0;}
  .custom .grow{flex:1;}
  .custom button,.addrow button{font:inherit;font-size:15px;border:none;border-radius:10px;padding:10px 14px;cursor:pointer;}
  .custom button{background:transparent;color:var(--clay);}
  .addrow{display:grid;gap:8px;background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:14px;}
  .addrow button{background:var(--moss);color:#fff;font-weight:600;}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
       padding:12px 16px calc(12px + env(safe-area-inset-bottom));}
  .bar .in{max-width:600px;margin:0 auto;display:flex;gap:10px;align-items:center;}
  a.btn{flex:1;text-align:center;padding:14px;border-radius:12px;background:var(--moss);color:#fff;font-weight:600;font-size:16px;text-decoration:none;}
  a.alt{color:var(--clay);font-size:13px;white-space:nowrap;}
  .msg{font-size:14px;color:var(--ink-soft);}
</style>
</head>
<body>
<main>
  <div>🌱 Lawn Log</div>
  <h1>My Plants</h1>
  <p id="intro">Check what's in your yard and tap <b>Save</b>. Reminders are timed to your frost dates and zone, and some move with the weather.</p>
  <input type="search" id="q" placeholder="Search: hydrangea, tomato, lilac, palm…" autocomplete="off">
  <h2>Your custom plants</h2>
  <p class="msg">Have something not listed? Name it and pick which plant type's care schedule it should follow.</p>
  <div id="customs"></div>
  <div class="addrow">
    <input type="text" id="cname" placeholder="Plant name, e.g. Grandma's lilac" maxlength="50">
    <select id="cprof"></select>
    <button id="cadd" type="button">＋ Add custom plant</button>
  </div>
  <div id="list"><p class="msg">Loading plants…</p></div>
</main>
<div class="bar"><div class="in">
  <a class="btn" id="save" href="#">Save (<span id="count">0</span>)</a>
  <a class="alt" id="gh" href="#">via GitHub</a>
</div></div>
<script src="lawn-site.js"></script>
<script>
  // Builds "🌿 plants: id, id, profile=Custom name" and hands it to the Lawn Log shortcut
  // (or a GitHub issue); the repo's workflow saves it to lawn-config.json.
  const S = window.LawnSite, list = document.getElementById("list");
  let customs = [], zone = null;
  const clean = s => s.replace(/[,=]/g, " ").replace(/\s+/g, " ").trim();

  function update() {
    const ids = [...document.querySelectorAll("#list input:checked")].map(i => i.value);
    const all = ids.concat(customs.map(c => `${c.profile}=${clean(c.name)}`));
    const text = "🌿 plants: " + (all.length ? all.join(", ") : "none");
    document.getElementById("count").textContent = all.length;
    document.getElementById("save").href = S.shortcut(text);
    document.getElementById("gh").href = S.github(text);
  }

  function renderCustoms(cat) {
    const box = document.getElementById("customs");
    box.innerHTML = customs.length ? "" : '<p class="msg">None yet.</p>';
    customs.forEach((c, i) => {
      const p = cat.find(x => x.id === c.profile) || {emoji: "🌱", name: c.profile};
      const row = document.createElement("div"); row.className = "custom";
      const em = document.createElement("span"); em.className = "em"; em.textContent = p.emoji;
      const txt = document.createElement("div"); txt.className = "grow";
      const n = document.createElement("div"); n.className = "name"; n.textContent = c.name;
      const t = document.createElement("div"); t.className = "tasks"; t.textContent = "Cared for as: " + p.name;
      txt.append(n, t);
      const rm = document.createElement("button"); rm.type = "button"; rm.textContent = "Remove";
      rm.onclick = () => { customs.splice(i, 1); renderCustoms(cat); update(); };
      row.append(em, txt, rm); box.append(row);
    });
  }

  function zoneNum(z) { const m = String(z || "").match(/^(\d+)/); return m ? +m[1] : null; }

  Promise.all([S.json("plant-catalog.json"), S.json("lawn-config.json").catch(() => ({}))]).then(([catalog, cfg]) => {
    const cat = catalog.plants;
    zone = zoneNum(cfg.climate && cfg.climate.zone);
    if (zone) document.getElementById("intro").innerHTML +=
      ` Your area: <b>USDA zone ${cfg.climate.zone}</b>${cfg.label ? " (" + cfg.label + ")" : ""}.`;
    const mine = new Set((cfg.plants || []).filter(p => typeof p === "string"));
    customs = (cfg.plants || []).filter(p => typeof p === "object");
    const sel = document.getElementById("cprof");
    sel.innerHTML = '<option value="">Care like… (choose a plant type)</option>' +
      cat.map(p => `<option value="${p.id}">${p.emoji} ${p.name}</option>`).join("");
    document.getElementById("cadd").onclick = () => {
      const name = clean(document.getElementById("cname").value);
      if (!name || !sel.value) { alert("Enter a name and choose a plant type."); return; }
      customs.push({name, profile: sel.value});
      document.getElementById("cname").value = ""; sel.value = "";
      renderCustoms(cat); update();
    };
    renderCustoms(cat);

    list.innerHTML = "";
    for (const group of catalog.categories) {
      const h = document.createElement("h2"); h.textContent = group; h.dataset.group = group; list.append(h);
      for (const p of cat.filter(p => p.category === group)) {
        const far = zone && p.zones && (zone < p.zones[0] || zone > p.zones[1]);
        const row = document.createElement("label"); row.className = "plant" + (far ? " far" : "");
        row.dataset.search = (p.name + " " + p.tasks.map(t => t.task).join(" ")).toLowerCase();
        row.dataset.group = group;
        const box = document.createElement("input");
        box.type = "checkbox"; box.value = p.id; box.checked = mine.has(p.id);
        box.addEventListener("change", update);
        const em = document.createElement("span"); em.className = "em"; em.textContent = p.emoji;
        const txt = document.createElement("div");
        const name = document.createElement("div"); name.className = "name"; name.textContent = p.name;
        if (far) { const z = document.createElement("span"); z.className = "zone"; z.textContent = `zones ${p.zones[0]}–${p.zones[1]}`; name.append(z); }
        const tasks = document.createElement("div"); tasks.className = "tasks";
        tasks.textContent = p.tasks.map(t => t.task).join(" · ");
        txt.append(name, tasks); row.append(box, em, txt); list.append(row);
      }
    }
    document.getElementById("q").addEventListener("input", e => {
      const q = e.target.value.trim().toLowerCase();
      document.querySelectorAll("label.plant").forEach(r => r.style.display = !q || r.dataset.search.includes(q) ? "" : "none");
      document.querySelectorAll("#list h2").forEach(h => {
        const any = [...document.querySelectorAll(`label.plant[data-group="${h.dataset.group}"]`)].some(r => r.style.display !== "none");
        h.style.display = any ? "" : "none";
      });
    });
    update();
  }).catch(() => { list.innerHTML = '<p class="msg">Couldn\'t load the plant list. Check your connection and reload.</p>'; });
</script>
</body>
</html>
